services:
  postgres:
    image: postgres:16-alpine
    container_name: uchebny-radar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uchebny_radar}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-uchebny_radar}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - db_backend_net

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uchebny-radar-backend-api
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-uchebny_radar}}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_ROLE: api
      APP_WORKER_ENABLED: "false"
      SERVER_PORT: ${SERVER_PORT:-8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db_backend_net
      - frontend_public_net


  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uchebny-radar-backend-worker
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-uchebny_radar}}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_ROLE: worker
      APP_WORKER_ENABLED: "true"
      SERVER_PORT: "8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db_backend_net


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uchebny-radar-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend-api
    networks:
      - frontend_public_net


  prometheus:
    image: alpine:latest
    container_name: uchebny-radar-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      - backend-api
    networks:
      - frontend_public_net


  grafana:
    image: alpine:latest
    container_name: uchebny-radar-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      - prometheus
    networks:
      - frontend_public_net


networks:
  db_backend_net:
    driver: bridge

  frontend_public_net:
    driver: bridge


volumes:
  postgres_data:
