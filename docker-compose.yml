services:
  # ============================================================================
  # 1. PostgreSQL Database Service
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: uchebny-radar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uchebny_radar}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-uchebny_radar}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - db_backend_net

  # ============================================================================
  # 2. Backend REST API Service
  # ============================================================================
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uchebny-radar-backend-api
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-uchebny_radar}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_ROLE: api
      APP_WORKER_ENABLED: "false"
      SERVER_PORT: ${SERVER_PORT:-8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db_backend_net
      - frontend_public_net

  # ============================================================================
  # 3. Reminder Worker Service (Background Task Processing)
  # ============================================================================
  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uchebny-radar-backend-worker
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-uchebny_radar}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_ROLE: worker
      APP_WORKER_ENABLED: "true"
      SERVER_PORT: "8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db_backend_net

  # ============================================================================
  # 4. Frontend SPA Service (Nginx)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uchebny-radar-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend-api
    networks:
      - frontend_public_net

  # ============================================================================
  # 5. Prometheus Monitoring Service (Lightweight Stub)
  # ============================================================================
  prometheus:
    image: alpine:latest
    container_name: uchebny-radar-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      - backend-api
    networks:
      - frontend_public_net

  # ============================================================================
  # 6. Grafana Dashboard Service (Lightweight Stub)
  # ============================================================================
  grafana:
    image: alpine:latest
    container_name: uchebny-radar-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      - prometheus
    networks:
      - frontend_public_net

# ==============================================================================
# Isolated Networks Configuration
# ==============================================================================
networks:
  # Isolated database network: Accessible ONLY by postgres, backend-api, backend-worker
  db_backend_net:
    driver: bridge

  # Public/Application network: Accessible by frontend, backend-api, and monitoring
  frontend_public_net:
    driver: bridge

# ==============================================================================
# Persistent Volumes Configuration
# ==============================================================================
volumes:
  postgres_data:
