server:
  port: 0

spring:
  application:
    name: uchebny-radar-test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    open-in-view: false
  flyway:
    enabled: false
  session:
    store-type: none
    jdbc:
      initialize-schema: never

app:
  worker:
    enabled: false
  cors:
    allowed-origins: http://localhost:5173
  security:
    cookie-secure: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
