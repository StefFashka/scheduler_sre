apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scheduler-sre-routes
spec:
  parentRefs:
    - name: scheduler-sre-gateway-backend
  rules:
    -  backendRefs:
        - name: my-app-v1
          port: 80
          weight: 90
        - name: my-app-v2
          port: 80
          weight: 10