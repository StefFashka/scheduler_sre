data_dir: /var/lib/vector

sources:
  k8s_source:
    type: kubernetes_logs

transforms:
  filter_app_logs:
    type: filter
    inputs:
      - k8s_source
    condition: '.kubernetes.pod_namespace == "default"'

  parse_json:
    type: remap
    inputs:
      - filter_app_logs
    source: |
      parsed = parse_json(.message) ?? {}
      . = merge!(., parsed)

sinks:
  vlogs:
    type: elasticsearch
    inputs:
      - parse_json
    endpoints: ["http://victoria-logs:9428/insert/elasticsearch/"]
    mode: "bulk"
    api_version: "v8"
    healthcheck:
      enabled: false
    query:
      _msg_field: "message"
      _time_field: "timestamp"
      _stream_fields: "kubernetes.pod_name,kubernetes.container_name"

