apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - config.yml
  - secret.yml
  - postgres.yml
  - backend.yml
  - worker.yml
  - frontend.yml
  - monitoring/victoria-logs.yml
  - monitoring/vector/vector.yml
  - monitoring/gateway.yml
  - monitoring/grafana/grafana.yml
  - monitoring/grafana/gateway.yml
  - alerting/alertmanager-deploy.yml
  - alerting/vmalert-deploy.yml

configMapGenerator:
  - name: vector-config
    files:
      - vector.yaml=vector-conf.yaml
  - name: grafana-datasources
    files:
      - datasources.yaml=grafana-datasources.yaml
  - name: alertmanager-config
    namespace: monitoring
    files:
      - alertmanager.yml=alerting/alertmanager.yml
    options:
      disableNameSuffixHash: true
  - name: vmalert-rules
    namespace: monitoring
    files:
      - rules.yml=alerting/rules.yml
    options:
      disableNameSuffixHash: true
  - name: grafana-dashboards-prov
    files:
      - dashboards.yaml=grafana-dashboards.yaml
    options:
      disableNameSuffixHash: true
  - name: grafana-dashboards-files
    files:
      - monitoring/dashboards
    options:
      disableNameSuffixHash: true

