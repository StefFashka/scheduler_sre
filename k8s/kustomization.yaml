apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - config.yml
  - secret.yml
  - postgres.yml
  - backend.yml
  - worker.yml
  - frontend.yml
  - victoria-logs.yml
  - vector.yml
  - grafana.yml

configMapGenerator:
  - name: vector-config
    files:
      - vector.yaml=vector-conf.yaml
  - name: grafana-datasources
    files:
      - datasources.yaml=grafana-datasources.yaml

