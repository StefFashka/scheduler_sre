apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  namespace: monitoring
  labels:
    app: vmalert
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmalert
  template:
    metadata:
      labels:
        app: vmalert
    spec:
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.102.1
          args:
            - "-datasource.url=http://vm-single-victoria-metrics-single-server.monitoring.svc.cluster.local:8428"
            - "-notifier.url=http://alertmanager.monitoring.svc.cluster.local:9093"
            - "-rule=/etc/vmalert/rules/*.yml"
            - "-evaluationInterval=10s"
            - "-httpListenAddr=:8880"
          ports:
            - containerPort: 8880
              name: http
          volumeMounts:
            - name: rules
              mountPath: /etc/vmalert/rules
      volumes:
        - name: rules
          configMap:
            name: vmalert-rules
---
apiVersion: v1
kind: Service
metadata:
  name: vmalert
  namespace: monitoring
  labels:
    app: vmalert
spec:
  type: ClusterIP
  ports:
    - port: 8880
      targetPort: 8880
      name: http
  selector:
    app: vmalert
