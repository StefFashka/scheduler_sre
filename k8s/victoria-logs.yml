apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoria-logs-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-logs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoria-logs
  template:
    metadata:
      labels:
        app: victoria-logs
    spec:
      containers:
        - name: victoria-logs
          image: victoriametrics/victoria-logs:v1.52.0
          args:
            - "-storageDataPath=/vlogs-data"
            - "-httpListenAddr=:9428"
            - "-retentionPeriod=7d"
          ports:
            - containerPort: 9428
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - mountPath: /vlogs-data
              name: data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: victoria-logs-data
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
spec:
  selector:
    app: victoria-logs
  ports:
    - port: 9428
      targetPort: 9428
      name: http
  type: ClusterIP

