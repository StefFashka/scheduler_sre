apiVersion: 1
datasources:
  - name: VictoriaLogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victoria-logs:9428
    isDefault: false
    jsonData:
      maxLines: 1000
  - name: VictoriaMetrics
    type: prometheus
    access: proxy
    url: http://vm-single-victoria-metrics-single-server.monitoring.svc.cluster.local:8428
    isDefault: true
    jsonData:
      httpMethod: POST
